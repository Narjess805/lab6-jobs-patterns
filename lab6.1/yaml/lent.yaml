apiVersion: batch/v1
kind: CronJob
metadata:
  name: lent
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: lent
              image: busybox:1.36
              command: ["sh", "-c", "echo debut; sleep 150; echo fin"]
